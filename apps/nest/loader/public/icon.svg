    <path d="M18.5 23 L9 15 L4 28"/>
    <path d="M16.6 31 L6.5 28.5 L3 44"/>
    <path d="M19 39 L11 41.5 L9 57"/>
    <path d="M45.5 23 L55 15 L60 28"/>
    <path d="M47.4 31 L57.5 28.5 L61 44"/>
    <path d="M45 39 L53 41.5 L55 57"/>
  </g>
  <!-- The Eye: big and round, an octopus's horizontal pupil. -->
  <circle cx="32" cy="31" r="16" fill="#1B1730" stroke="#8F7CFF" stroke-width="2.6"/>
  <circle cx="32" cy="31" r="12.6" fill="url(#oraknid-iris)"/>
  <rect x="21.8" y="27.9" width="20.4" height="6.2" rx="3.1" fill="#120F1F"/>
