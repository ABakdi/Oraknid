<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Oraknid</title>
  <rect width="64" height="64" rx="14" fill="#14121F"/>
  <g transform="translate(6.4 6.4) scale(0.8)">
  <defs>
    <radialGradient id="oraknid-iris" cx="0.4" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#F4A73A"/>
      <stop offset="1" stop-color="#C2621B"/>
