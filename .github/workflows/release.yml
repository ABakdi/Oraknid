# A release's assets on a pushed tag (ADR-047, ADR-058): install.sh pinned
# to the tag and its SHA256SUMS, built by scripts/release.mjs --assets-only,
# attached to the tag's GitHub release (made, as a pre-release before 1.0,
# with the CHANGELOG's section as its notes, when there is none yet).
# `node scripts/release.mjs X.Y.Z --publish` does the same from my machine;
# this covers a tag pushed by hand.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build install.sh and SHA256SUMS
        run: node scripts/release.mjs "${GITHUB_REF_NAME#v}" --assets-only

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="dist/release/$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dir/install.sh" "$dir/SHA256SUMS" --clobber
          else
            pre=""
            case "$GITHUB_REF_NAME" in v0.*|*-*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$dir/install.sh" "$dir/SHA256SUMS" \
              --title "Oraknid $GITHUB_REF_NAME" --notes-file "$dir/notes.md" $pre
          fi
